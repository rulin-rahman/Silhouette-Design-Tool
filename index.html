<script>

const apiKeyInput = document.getElementById('api-key-input');
// Load saved API key from localStorage if available
if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
}
apiKeyInput.addEventListener('input', () => {
    localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
});

function getApiKey() {
    return apiKeyInput.value.trim();
}

// State Variables
let referenceImageBase64 = null;
let originalImageData = null; // Store original generated pixels
let generatedWidth = 1024;
let generatedHeight = 1024;
// Pan & Zoom State
let scale = 1;
let panX = 0;
let panY = 0;
let isDragging = false;
let startDragX = 0;
let startDragY = 0;

// DOM Elements
const uploadInput = document.getElementById('image-upload');
const uploadPreview = document.getElementById('image-preview');
const uploadPlaceholder = document.getElementById('upload-placeholder');
const btnAutoPrompt = document.getElementById('btn-auto-prompt');
const promptArea = document.getElementById('prompt-area');
const promptProgressText = document.getElementById('prompt-progress-text');
const promptProgressBar = document.getElementById('prompt-progress-bar');
const promptProgressContainer = document.getElementById('prompt-progress-container');
const btnGenerate = document.getElementById('btn-generate-image');
const btnDownloadPng = document.getElementById('btn-download-png');
const btnResetAll = document.getElementById('btn-reset-all');
const nicheSelect = document.getElementById('niche-select');
const subNicheSelect = document.getElementById('sub-niche-select');
const canvasContainer = document.getElementById('canvas-container');
const transformWrapper = document.getElementById('transform-wrapper');
const mainCanvas = document.getElementById('main-canvas');
const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });
const hiddenCanvas = document.getElementById('hidden-canvas');
const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
const loadingOverlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');

// Modal Helpers
function showModal(title, desc) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').textContent = desc;
    document.getElementById('message-modal').classList.remove('hidden');
}
function closeModal() {
    document.getElementById('message-modal').classList.add('hidden');
}
function showLoading(text) {
    loadingText.textContent = text;
    loadingOverlay.classList.remove('hidden');
    loadingOverlay.classList.add('flex');
}
function hideLoading() {
    loadingOverlay.classList.add('hidden');
    loadingOverlay.classList.remove('flex');
}

const subcategories = {

"Animals & Wildlife": ["Cats", "Dogs", "Lions", "Tigers", "Elephants", "Bears", "Deer", "Wolves", "Foxes", "Rabbits", "Monkeys", "Gorillas", "Snakes", "Lizards", "Frogs", "Turtles", "Dolphins", "Whales", "Sharks", "Fish", "Eagles", "Owls", "Parrots", "Butterflies", "Spiders", "Horses", "Cows", "Pigs"],

"Food & Beverage": ["Burgers", "Pizza", "Hotdogs", "Sushi", "Tacos", "Steak", "Coffee Mugs", "Wine Glasses", "Beer Mugs", "Cocktails", "Cakes", "Ice Cream", "Fruits", "Vegetables", "Cutlery", "Donuts", "Cupcakes", "Cheese"],
"Hobbies & Leisure": ["Fishing Rods", "Tents & Camping", "Gardening Tools", "Books (Reading)", "Cameras (Photography)", "Board Games", "Video Game Controllers", "Cooking Utensils", "Dancing Shoes"],
"Holidays & Occasions": ["Christmas Trees", "Santa Claus", "Halloween Pumpkins", "Ghosts", "Easter Bunnies", "Valentine Hearts", "Thanksgiving Turkeys", "New Year Fireworks", "Birthdays Cakes", "Wedding Rings", "Balloons", "Presents"],

"Vehicles & Transport": ["Sedan Cars", "Sports Cars", "Trucks", "Buses", "Vans", "Motorcycles", "Bicycles", "Scooters", "Trains & Locomotives", "Boats & Ships", "Submarines", "Airplanes", "Helicopters", "Tractors"],

"Zodiac & Astrology": ["Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius", "Capricorn", "Aquarius", "Pisces", "Tarot Cards", "Crystal Balls", "Moons & Stars"]

function populateSubcategories() {
    const niche = nicheSelect.value;
    const subs = ["None"].concat(subcategories[niche] || []);
    subNicheSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join("");
}
nicheSelect.addEventListener('change', populateSubcategories);
populateSubcategories(); // Initialize subcategories on load

// Handle Image Upload
uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        uploadPreview.src = event.target.result;
        uploadPreview.classList.remove('hidden');
        uploadPlaceholder.classList.add('hidden');
        // Extract base64 without prefix
        referenceImageBase64 = event.target.result.split(',')[1];
    };
    reader.readAsDataURL(file);
});

// Pan & Zoom Controls
function updateTransform() {
    transformWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}
document.getElementById('btn-zoom-in').addEventListener('click', () => { scale = Math.min(scale + 0.2, 5); updateTransform(); });
document.getElementById('btn-zoom-out').addEventListener('click', () => { scale = Math.max(scale - 0.2, 0.1); updateTransform(); });
document.getElementById('btn-reset-view').addEventListener('click', () => { scale = 1; panX = 0; panY = 0; updateTransform(); });

canvasContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomSensitivity = 0.001;
    const delta = e.deltaY * -zoomSensitivity;
    const newScale = Math.min(Math.max(scale + delta, 0.1), 10);
    scale = newScale;
    updateTransform();
});

canvasContainer.addEventListener('mousedown', (e) => {
    isDragging = true;
    startDragX = e.clientX - panX;
    startDragY = e.clientY - panY;
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - startDragX;
    panY = e.clientY - startDragY;
    updateTransform();
});

window.addEventListener('mouseup', () => isDragging = false);

btnAutoPrompt.addEventListener('click', async () => {
    const apiKey = getApiKey();
    if (!apiKey) {
        showModal("API Key Required", "Please enter your Gemini API Key in the top right header.");
        return;
    }

    const niche = document.getElementById('niche-select').value;
    const subNiche = document.getElementById('sub-niche-select').value;
    const grid = document.getElementById('grid-select').value;
    
    btnAutoPrompt.disabled = true;
    promptProgressContainer.classList.remove('hidden');
    promptProgressText.classList.remove('hidden');
    promptArea.value = "";
    let progress = 0;
    
    const progressInterval = setInterval(() => {
        progress += Math.floor(Math.random() * 5) + 1;
        if (progress > 90) progress = 90;
        promptProgressBar.style.width = `${progress}%`;
        promptProgressText.textContent = `${progress}%`;
    }, 300);

    try {
        const parts = [];
        const systemPrompt = `You are an expert AI prompt engineer specializing in professional silhouette designs.
Your task is to output ONLY the text of a highly structured, long, and detailed prompt meant for an image generation model.
Requirements for the generated prompt:
- Specify the design niche: ${niche} - ${subNiche}.
- Grid configuration: ${grid}. If >1, describe how the canvas is divided into a grid.
- MUST INCLUDE INSTRUCTIONS FOR VARIETY: If Grid is > 1, STRICTLY COMMAND the image AI to make EVERY SINGLE ITEM IN THE GRID UNIQUE. Force different poses, different angles, different sub-types, or different variations of the subject in each cell. NO DUPLICATES.
- MUST INCLUDE INSTRUCTIONS FOR REGION-BASED STRUCTURE: Describe exactly what goes in the center, edges, top, bottom.
- MUST INCLUDE INSTRUCTIONS FOR ISOLATION (NO GROUND): Explicitly state that there MUST BE NO ground line, floor, terrain, base, or drop shadows. The main subject(s) must be completely isolated and floating in pure white space.
- MUST INCLUDE INSTRUCTIONS FOR EDGES AND LINES: Command "Adobe Illustrator pen tool style, flawless mathematically perfect bezier curves, minimal anchor points, extreme minimalism". For tech/vehicles, strictly command "flawless mathematically straight lines, perfect geometric circles, precise right angles, exact symmetry, no wobbly or jagged lines". For organic subjects, command "ultra-smooth, flowing continuous bezier curves".
- MUST INCLUDE INSTRUCTIONS FOR JOINT/LAYER SEPARATION: Explicitly state to maintain negative space or distinct path separations where objects intersect (e.g., "leave a tiny white gap between the feet and the ground so they are separate layers").
- MUST demand "true professional minimalist vector graphic style, ultra-crisp anti-aliased edges, zero pixelation, exact mathematical proportions."
- The final image MUST BE pure black and white, white background, solid black foreground.
Generate ONLY the detailed prompt string, nothing else.`;
        
        parts.push({ text: systemPrompt });
        if (referenceImageBase64) {
            parts.push({ text: "Use the attached image as the core compositional reference for the silhouette subjects." });
            parts.push({
                inlineData: { mimeType: "image/jpeg", data: referenceImageBase64 }
            });
        }
        
        const payload = {
            contents: [{ role: "user", parts: parts }],
        };
        
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        clearInterval(progressInterval);
        promptProgressBar.style.width = '100%';
        promptProgressText.textContent = '100%';
        
        if (result.candidates && result.candidates[0].content.parts[0].text) {
            let generatedPrompt = result.candidates[0].content.parts[0].text;
            generatedPrompt = generatedPrompt.replace(/^```[a-z]*
/i, "").replace(/```$/i, "").trim();
            promptArea.value = generatedPrompt;
        } else {
            throw new Error("Invalid response format from prompt generator.");
        }
    } catch (error) {
        clearInterval(progressInterval);
        console.error(error);
        showModal("Error", "Failed to generate prompt. Please check your API key or try again.");
        promptProgressContainer.classList.add('hidden');
        promptProgressText.classList.add('hidden');
    } finally {
        btnAutoPrompt.disabled = false;
        setTimeout(() => {
            promptProgressContainer.classList.add('hidden');
            promptProgressText.classList.add('hidden');
            promptProgressBar.style.width = '0%';
        }, 2000);
    }
});

btnGenerate.addEventListener('click', async () => {
    const apiKey = getApiKey();
    if (!apiKey) {
        showModal("API Key Required", "Please enter your Gemini API Key in the top right header.");
        return;
    }

    let promptText = promptArea.value.trim();
    if (!promptText) {
        showModal("Missing Prompt", "Please enter a prompt or auto-generate one first.");
        return;
    }

    promptText += "\n\nCRITICAL ENFORCEMENT: The final image MUST be a pure solid black silhouette on a pure solid white background. No grayscale shading, no gradients. The design MUST have ultra-smooth, perfectly anti-aliased edges. Absolutely NO pixelation, NO wobbly lines, NO jagged artifacts, and NO hand-drawn imperfections. Force mathematically perfect geometric shapes, exact symmetry, perfect circles, and flawless straight lines where applicable. True professional premium vector graphic style, exactly like Adobe Illustrator pen tool artwork with minimal anchor points. ABSOLUTELY NO GROUND, NO FLOOR, NO SHADOWS, AND NO BASE. The subject must be entirely isolated, floating against the pure white background. IF A GRID IS REQUESTED: EVERY SINGLE ITEM IN THE GRID MUST BE COMPLETELY UNIQUE. Vary the shape, pose, angle, or sub-type of each item. DO NOT repeat the exact same silhouette multiple times.";

    showLoading("Generating AI Silhouette...");
    btnGenerate.disabled = true;

    try {
        const payload = {
            contents: [{
                role: 'user',
                parts: [{ text: promptText }]
            }],
            generationConfig: {
                responseModalities: ['IMAGE'],
                imageConfig: { aspectRatio: "1:1" }
            },
        };

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        // Check for parts that contain inline data
        let part = null;
        if (result?.candidates?.[0]?.content?.parts) {
            for (const p of result.candidates[0].content.parts) {
                if (p.inlineData) {
                    part = p;
                    break;
                }
            }
        }

        if (!part) {
            throw new Error("No image data found in response.");
        }

        const base64Data = part.inlineData.data;
        const mimeType = part.inlineData.mimeType;
        await loadImageToCanvas(`data:${mimeType};base64,${base64Data}`);

        btnDownloadPng.disabled = false;
        scale = 1; panX = 0; panY = 0; updateTransform();
    } catch (error) {
        console.error(error);
        showModal("Generation Failed", "Could not generate image. Please check your API key or prompt.");
    } finally {
        hideLoading();
        btnGenerate.disabled = false;
    }
});

function loadImageToCanvas(dataUrl) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            generatedWidth = img.width;
            generatedHeight = img.height;
            mainCanvas.width = generatedWidth;
            mainCanvas.height = generatedHeight;
            hiddenCanvas.width = generatedWidth;
            hiddenCanvas.height = generatedHeight;
            mainCanvas.style.maxWidth = "800px";
            mainCanvas.style.height = "auto";
            hiddenCtx.drawImage(img, 0, 0);
            originalImageData = hiddenCtx.getImageData(0, 0, generatedWidth, generatedHeight);
            processEdges();
            resolve();
        };
        img.src = dataUrl;
    });
}

function processEdges() {
    if (!originalImageData) return;
    mainCtx.clearRect(0, 0, generatedWidth, generatedHeight);
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = generatedWidth;
    tempCanvas.height = generatedHeight;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(originalImageData, 0, 0);
    mainCtx.filter = 'none';
    mainCtx.drawImage(tempCanvas, 0, 0);
    thresholdCanvas(mainCtx, generatedWidth, generatedHeight);
}

function thresholdCanvas(ctx, width, height) {
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        let alpha;
        if (lum > 245) {
            alpha = 0;
        } else if (lum < 15) {
            alpha = 255;
        } else {
            alpha = 255 - lum;
        }
        data[i] = 0;
        data[i+1] = 0;
        data[i+2] = 0;
        data[i+3] = alpha;
    }
    ctx.putImageData(imgData, 0, 0);
}

btnDownloadPng.addEventListener('click', () => {
    const dataURL = mainCanvas.toDataURL("image/png");
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = `Silhouette_Pro_${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
});

    nicheSelect.value = "None";
    document.getElementById('grid-select').value = "1 (Single Design)";
    populateSubcategories();
    uploadInput.value = "";
    uploadPreview.src = "";
    uploadPreview.classList.add('hidden');
    uploadPlaceholder.classList.remove('hidden');
    referenceImageBase64 = null;
    promptArea.value = "";
    mainCtx.clearRect(0, 0, generatedWidth, generatedHeight);
    hiddenCtx.clearRect(0, 0, generatedWidth, generatedHeight);
    originalImageData = null;
    btnDownloadPng.disabled = true;
    scale = 1; panX = 0; panY = 0; updateTransform();
});
